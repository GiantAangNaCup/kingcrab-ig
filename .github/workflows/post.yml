name: Post to Instagram

on:
  schedule:
    # 11:47 UTC = 18:47 Bangkok, every day (GitHub may start a few minutes late)
    - cron: "47 11 * * *"
  workflow_dispatch:
    inputs:
      post_date:
        description: "Post a specific folder (YYYY-MM-DD). Leave empty for the next one in the queue."
        required: false
      dry_run:
        description: "Dry run: show what would be posted, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish today's carousel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          POST_DATE: ${{ inputs.post_date }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python post.py

      - name: Mark as posted
        run: |
          git config user.name "kingcrab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/*/.posted 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "posted $(TZ=Asia/Bangkok date +%F)" && git push)

      # Instagram tokens last 60 days. Refresh every Monday so it never expires.
      - name: Refresh Instagram token (Mondays)
        if: github.event_name == 'schedule' && env.HAS_PAT == 'true'
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          [ "$(TZ=Asia/Bangkok date +%u)" = "1" ] || exit 0
          NEW=$(curl -fsS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | python -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          GH_TOKEN="$GH_PAT" gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Token refreshed"
