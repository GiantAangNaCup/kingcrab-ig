name: Render slides

# Turns content/*.json (text + Higgsfield illustration URLs) into posts/<date>/*.jpg
on:
  push:
    paths: ["content/**", "render.py", "fonts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: render

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python render.py content/*.json posts
      - name: Commit rendered slides
        run: |
          git config user.name "kingcrab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "render slides" && git pull --rebase && git push)
